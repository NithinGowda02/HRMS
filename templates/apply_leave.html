{% extends "base.html" %}
{% block title %}Apply Leave – HRMS{% endblock %}
{% block page_title %}Apply for Leave{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;">
  <div class="card-header">
    <span class="card-title">Leave Application</span>
    <a href="{{ url_for('leaves') }}" class="btn btn-sm btn-outline">← Back</a>
  </div>
  <div class="card-body">
    <form method="POST" style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label>From Date</label>
        <input name="start_date" type="date" required>
      </div>
      <div class="form-group">
        <label>To Date</label>
        <input name="end_date" type="date" required>
      </div>
      <div class="form-group">
        <label>Reason</label>
        <textarea name="reason" placeholder="Brief reason for leave..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Submit Application</button>
    </form>
  </div>
</div>
{% endblock %}
