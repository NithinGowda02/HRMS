{% extends "base.html" %}
{% block title %}Edit Employee – HRMS{% endblock %}
{% block page_title %}Edit Employee{% endblock %}

{% block content %}
<div class="card" style="max-width:640px;">
  <div class="card-header">
    <span class="card-title">Edit — {{ emp.first_name }} {{ emp.last_name }}</span>
    <a href="{{ url_for('employees') }}" class="btn btn-sm btn-outline">← Back</a>
  </div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Employee Number</label>
          <input name="emp_number" value="{{ emp.emp_number }}" required>
        </div>
        <div class="form-group">
          <label>First Name</label>
          <input name="first_name" value="{{ emp.first_name }}" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input name="last_name" value="{{ emp.last_name }}" required>
        </div>
        <div class="form-group">
          <label>Position</label>
          <input name="position" value="{{ emp.position }}">
        </div>
        <div class="form-group">
          <label>Department</label>
          <input name="department" value="{{ emp.department }}">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input name="email" type="email" value="{{ emp.email }}">
        </div>
        <div class="form-group">
          <label>Monthly Salary (₹)</label>
          <input name="salary" type="number" step="0.01" value="{{ emp.salary }}">
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('employees') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
