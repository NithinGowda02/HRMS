{% extends "base.html" %}
{% block title %}Add Employee – HRMS{% endblock %}
{% block page_title %}Add Employee{% endblock %}

{% block content %}
<div class="card" style="max-width:640px;">
  <div class="card-header">
    <span class="card-title">Add New Employee</span>
    <a href="{{ url_for('employees') }}" class="btn btn-sm btn-outline">← Back</a>
  </div>
  <div class="card-body">
    <form method="POST">
      <div class="soft-note" style="margin-bottom:18px;">
        A secure employee login will be created automatically using the employee number as the login ID.
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Employee Number</label>
          <input name="emp_number" required placeholder="e.g. EMP001">
        </div>
        <div class="form-group">
          <label>First Name</label>
          <input name="first_name" required placeholder="First name">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input name="last_name" required placeholder="Last name">
        </div>
        <div class="form-group">
          <label>Position</label>
          <input name="position" placeholder="e.g. Software Developer">
        </div>
        <div class="form-group">
          <label>Department</label>
          <input name="department" placeholder="e.g. Engineering">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input name="email" type="email" placeholder="email@company.com">
        </div>
        <div class="form-group">
          <label>Monthly Salary (₹)</label>
          <input name="salary" type="number" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;">
        <button type="submit" class="btn btn-success">Confirm</button>
        <a href="{{ url_for('employees') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
